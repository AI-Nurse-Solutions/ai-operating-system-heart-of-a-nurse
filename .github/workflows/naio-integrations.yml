name: NAIO Integration Contract

on:
  pull_request:
    paths:
      - "naio-integrations/**"
      - "mission-control/**"
      - "tests/test_naio_integrations.py"
      - "scripts/build-mission-control-manifests.py"
      - "scripts/build-mission-control-packet-bundles.py"
      - "scripts/build-mission-control-example-workspace.py"
      - "scripts/build-mission-control-healthcare-sandbox.py"
      - "scripts/scan-public-healthcare-artifacts.py"
      - ".github/workflows/naio-integrations.yml"
  push:
    branches: [main]
    paths:
      - "naio-integrations/**"
      - "mission-control/**"
      - "tests/test_naio_integrations.py"
      - "scripts/build-mission-control-manifests.py"
      - "scripts/build-mission-control-packet-bundles.py"
      - "scripts/build-mission-control-example-workspace.py"
      - "scripts/build-mission-control-healthcare-sandbox.py"
      - "scripts/scan-public-healthcare-artifacts.py"
      - ".github/workflows/naio-integrations.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Verify Python syntax
        run: python3 -m py_compile naio-integrations/src/naio_integrations/*.py naio-integrations/tests/*.py tests/test_naio_integrations.py scripts/build-mission-control-manifests.py scripts/build-mission-control-packet-bundles.py scripts/build-mission-control-example-workspace.py scripts/build-mission-control-healthcare-sandbox.py
      - name: Rebuild committed Mission Control artifacts twice
        run: |
          set -euo pipefail
          python3 scripts/build-mission-control-manifests.py
          python3 scripts/build-mission-control-packet-bundles.py
          python3 scripts/build-mission-control-example-workspace.py
          python3 scripts/build-mission-control-healthcare-sandbox.py
          first="$(find mission-control -type f | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)"
          python3 scripts/build-mission-control-manifests.py
          python3 scripts/build-mission-control-packet-bundles.py
          python3 scripts/build-mission-control-example-workspace.py
          python3 scripts/build-mission-control-healthcare-sandbox.py
          second="$(find mission-control -type f | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)"
          test "$first" = "$second"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all mission-control)"
      - name: Run Integration Contract suite
        run: python3 -m unittest discover -s naio-integrations/tests -p 'test_*.py' -v
      - name: Run repo-level integration regression
        run: python3 tests/test_naio_integrations.py
      - name: Refuse accidental secrets or PHI examples in shipped artifacts
        run: |
          python3 scripts/scan-public-healthcare-artifacts.py naio-integrations/src --label INTEGRATIONS
          python3 scripts/scan-public-healthcare-artifacts.py naio-integrations/config --label INTEGRATIONS
          python3 scripts/scan-public-healthcare-artifacts.py naio-integrations/README.md --label INTEGRATIONS
          python3 scripts/scan-public-healthcare-artifacts.py mission-control --label MISSION-CONTROL
