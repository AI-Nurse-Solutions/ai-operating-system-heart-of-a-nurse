permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run aggregate repository tests
        run: npm test
      - name: Scan current public governance surfaces
        run: |
          pages=(
            directive.html offers.html index.html student-nurse.html nurse-practitioner.html staff-nurse.html medical-resident.html assets/student-nurse-funnel.js assets/nurse-practitioner-funnel.js assets/staff-nurse-funnel.js assets/medical-resident-funnel.js pathways.html explore-ecosystem.html about.html start-here.html faq.html
            terms.html privacy.html licensing.html governed-harness.html resources.html media.html
            architecture-report.html article-evidence-nurse-ai-os.html switchboard/index.html
            care-intelligence/index.html
            wellness-services-marketing-managers/index.html
          )
          for page in "${pages[@]}"; do
            python3 scripts/scan-public-healthcare-artifacts.py "$page" --label WEBSITE
          done
          for locale in ar es fr hi ru tl vi zh; do
            python3 scripts/scan-public-healthcare-artifacts.py "$locale/about.html" --label LOCALE
            python3 scripts/scan-public-healthcare-artifacts.py "assets/nurse-ai-os-media-packet-$locale.md" --label MEDIA
          done
          documents=(
            assets/30-day-roadmap.md
            assets/founding-year-guide.md assets/founding-year-guide.pdf
            assets/hermes-cheat-sheet.md assets/lamp-huddle.md
            assets/make-it-yours-six-workflows.md assets/make-it-yours-six-workflows.pdf
            assets/nurse-ai-os-workbook.md assets/safety-rules-edena.md assets/governance-kit.zip
          )
          for document in "${documents[@]}"; do
            python3 scripts/scan-public-healthcare-artifacts.py "$document" --label GOVERNANCE_RESOURCE
          done
          python3 scripts/scan-public-healthcare-artifacts.py assets/nurse-ai-os-media-packet.md --label MEDIA
      - name: Verify clean execution and whitespace
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
