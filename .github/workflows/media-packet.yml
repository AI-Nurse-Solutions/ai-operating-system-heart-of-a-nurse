name: Media packet integrity

on:
  pull_request:
    paths:
      - "assets/nurse-ai-os-media-packet*.md"
      - "assets/nurse-ai-os-media-packet*.pdf"
      - "tools/build-pdfs.py"
      - "scripts/requirements-media-pdf.txt"
      - "media.html"
      - "media-hi.html"
      - "sitemap.xml"
      - "about.html"
      - "*/about.html"
      - "index.html"
      - "*/index.html"
      - "tests/test_media_packet.py"
      - "tests/test_public_entrypoint_policy.py"
      - ".github/workflows/media-packet.yml"
  push:
    branches: [main]
    paths:
      - "assets/nurse-ai-os-media-packet*.md"
      - "assets/nurse-ai-os-media-packet*.pdf"
      - "tools/build-pdfs.py"
      - "scripts/requirements-media-pdf.txt"
      - "media.html"
      - "media-hi.html"
      - "sitemap.xml"
      - "about.html"
      - "*/about.html"
      - "index.html"
      - "*/index.html"
      - "tests/test_media_packet.py"
      - "tests/test_public_entrypoint_policy.py"
      - ".github/workflows/media-packet.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-media-pdf.txt
      - name: Install pinned media verifier
        run: python -m pip install --require-hashes -r scripts/requirements-media-pdf.txt
      - name: Rebuild accessible Hindi brief
        run: |
          python tools/build-pdfs.py media-hi
          git diff --exit-code -- media-hi.html
      - name: Verify source, PDFs, links, metadata, and policy
        run: |
          python tests/test_media_packet.py
          python tests/test_public_entrypoint_policy.py
