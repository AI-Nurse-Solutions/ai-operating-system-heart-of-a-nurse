name: Nurse AI OS app builds

# ADR 0003: the pilot ships as a local app that opens the screens in the
# browser. This builds it for Windows, macOS, and Linux with the Python
# runtime bundled, then proves each build works without a terminal-level
# setup: a built-in self-test on every platform, and the full browser
# journeys against the packaged Linux build and macOS bundle.
#
# Builds are UNSIGNED until signing identities exist. Artifacts are for
# testing only and must not be distributed to managers.

on:
  pull_request:
    paths:
      - "nurse-manager/**"
      - "naio-integrations/src/**"
      - "naio-integrations/config/**"
      - ".github/workflows/nurse-manager-app.yml"
  push:
    branches: [main]
    paths:
      - "nurse-manager/**"
      - "naio-integrations/src/**"
      - "naio-integrations/config/**"
      - ".github/workflows/nurse-manager-app.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYINSTALLER_VERSION: "6.22.3"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # Only what the app is built from. Other parts of the repository
          # have paths longer than Windows allows, and the app needs none of them.
          sparse-checkout: |
            nurse-manager
            naio-integrations
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the pinned build tool
        run: |
          python -m pip install --only-binary=:all: "pyinstaller==${{ env.PYINSTALLER_VERSION }}"
      - name: Build the app
        run: pyinstaller --noconfirm --clean nurse-manager/packaging/nurse-ai-os.spec --distpath dist --workpath build
      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        run: ./dist/nurse-ai-os --self-test
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: '"dist/Nurse AI OS.app/Contents/MacOS/nurse-ai-os" --self-test'
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # A windowed app returns to the shell immediately; wait for its exit code.
        run: |
          $p = Start-Process -FilePath "dist\nurse-ai-os.exe" -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - uses: actions/setup-node@v4
        if: runner.os != 'Windows'
        with:
          node-version: "22"
      - name: Browser dependencies
        if: runner.os != 'Windows'
        run: |
          npm ci --ignore-scripts
          node nurse-manager/tests/test_app_launch.mjs
      - name: Browser journeys against the packaged build (Linux)
        if: runner.os == 'Linux'
        run: |
          NURSE_AI_OS_BIN="$PWD/dist/nurse-ai-os" node nurse-manager/tests/test_app_browser.mjs
          NURSE_AI_OS_BIN="$PWD/dist/nurse-ai-os" node nurse-manager/tests/test_capture_browser.mjs
      - name: Browser journeys against the packaged bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          NURSE_AI_OS_BIN="$PWD/dist/Nurse AI OS.app/Contents/MacOS/nurse-ai-os" node nurse-manager/tests/test_app_browser.mjs
          NURSE_AI_OS_BIN="$PWD/dist/Nurse AI OS.app/Contents/MacOS/nurse-ai-os" node nurse-manager/tests/test_capture_browser.mjs
      - name: Package macOS bundle
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent "Nurse AI OS.app" nurse-ai-os-macos-unsigned.zip
      - name: Record Linux artifact and source hashes
        if: runner.os == 'Linux'
        run: python nurse-manager/tools/build_receipt.py --artifact dist/nurse-ai-os --output dist/build-receipt.json
      - name: Record macOS artifact and source hashes
        if: runner.os == 'macOS'
        run: python nurse-manager/tools/build_receipt.py --artifact dist/nurse-ai-os-macos-unsigned.zip --output dist/build-receipt.json
      - name: Record Windows artifact and source hashes
        if: runner.os == 'Windows'
        run: python nurse-manager/tools/build_receipt.py --artifact dist/nurse-ai-os.exe --output dist/build-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: nurse-ai-os-${{ runner.os }}-UNSIGNED-test-build
          path: |
            dist/nurse-ai-os
            dist/nurse-ai-os.exe
            dist/nurse-ai-os-macos-unsigned.zip
            dist/build-receipt.json
          if-no-files-found: error
          retention-days: 14
