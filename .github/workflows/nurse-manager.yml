name: Nurse Manager core

on:
  pull_request:
    paths:
      - "nurse-manager/**"
      - "package.json"
      - "package-lock.json"
      - "naio-integrations/src/**"
      - "naio-integrations/config/**"
      - ".github/workflows/nurse-manager.yml"
  push:
    branches: [main]
    paths:
      - "nurse-manager/**"
      - "package.json"
      - "package-lock.json"
      - "naio-integrations/src/**"
      - "naio-integrations/config/**"
      - ".github/workflows/nurse-manager.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify Python syntax
        run: python3 -m py_compile nurse-manager/src/nurse_manager/*.py nurse-manager/tests/*.py nurse-manager/tools/*.py
      - name: Run manager core suite
        run: python3 -m unittest discover -s nurse-manager/tests -p 'test_*.py' -v
      - name: Refuse accidental secrets or PHI examples in shipped artifacts
        run: |
          python3 scripts/scan-public-healthcare-artifacts.py nurse-manager/src --label NURSE-MANAGER
          python3 scripts/scan-public-healthcare-artifacts.py nurse-manager/config --label NURSE-MANAGER
          python3 scripts/scan-public-healthcare-artifacts.py nurse-manager/samples --label NURSE-MANAGER
          python3 scripts/scan-public-healthcare-artifacts.py nurse-manager/docs --label NURSE-MANAGER
          python3 scripts/scan-public-healthcare-artifacts.py nurse-manager/contracts --label NURSE-MANAGER

  florence-x-contract:
    # Build step 2.11: adapter output must satisfy Florence-X's own Pydantic
    # models, and the pinned schema copies must match upstream byte-for-byte.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: AI-Nurse-Solutions/florence-x
          ref: 09675bf61062534e21e1e4aded2f6a14e48f6b8e
          path: florence-x-upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Florence-X core at the pinned commit
        run: python3 -m pip install ./florence-x-upstream/packages/florence-core
      - name: Validate adapter output against Florence-X
        env:
          FLORENCE_X_DIR: florence-x-upstream
        run: |
          set -euo pipefail
          python3 -m unittest discover -s nurse-manager/tests -p 'test_florence_adapter.py' -v 2>&1 | tee adapter.log
          # The contract tests must actually run here, not skip.
          ! grep -E "skipped '(Florence-X is not installed|no upstream checkout)" adapter.log

  ipc-contract:
    # Build step 1.4: the real CLI envelopes satisfy the IPC schema under
    # ajv (strict, draft 2020-12) and typecheck against the generated
    # TypeScript under tsc --strict, as the desktop renderer will use them.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci --ignore-scripts
      - name: Generated TypeScript is current
        run: python3 nurse-manager/tools/gen_ipc_types.py --check
      - name: Validate envelopes with ajv and tsc
        run: npm run test:nurse-manager-ipc
