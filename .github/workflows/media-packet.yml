name: Media packet integrity

on:
  pull_request:
    paths:
      - "**/*.html"
      - "assets/30-day-roadmap.*"
      - "assets/governance-kit.zip"
      - "assets/nurse-ai-os-starter-kit.zip"
      - "assets/founding-year-guide.*"
      - "assets/hermes-cheat-sheet.*"
      - "assets/hermes-essentials-guide.*"
      - "assets/hermes-power-guide.*"
      - "assets/lamp-huddle.*"
      - "assets/make-it-yours-six-workflows.*"
      - "assets/nurse-ai-os-workbook.*"
      - "assets/safety-rules-edena.*"
      - "governance-kit/**"
      - "starter-kit/My-Nurse-AI-OS/**"
      - "assets/nurse-ai-os-media-packet*.md"
      - "assets/nurse-ai-os-media-packet*.pdf"
      - "assets/nurse-ai-os-architecture-report.md"
      - "assets/nurse-ai-os-architecture-report.pdf"
      - "assets/fonts/**"
      - "tools/build-governance-kit.py"
      - "tools/build-starter-kit.py"
      - "tools/build-pdfs.py"
      - "scripts/render-media-pdf.*"
      - "scripts/requirements-media-pdf.txt"
      - "package.json"
      - "package-lock.json"
      - "media.html"
      - "media-ar.html"
      - "media-hi.html"
      - "sitemap.xml"
      - "about.html"
      - "*/about.html"
      - "index.html"
      - "*/index.html"
      - "tests/test_media_packet.py"
      - "tests/test_public_governance_artifacts.py"
      - "tests/test_public_entrypoint_policy.py"
      - ".github/workflows/media-packet.yml"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "assets/30-day-roadmap.*"
      - "assets/governance-kit.zip"
      - "assets/nurse-ai-os-starter-kit.zip"
      - "assets/founding-year-guide.*"
      - "assets/hermes-cheat-sheet.*"
      - "assets/hermes-essentials-guide.*"
      - "assets/hermes-power-guide.*"
      - "assets/lamp-huddle.*"
      - "assets/make-it-yours-six-workflows.*"
      - "assets/nurse-ai-os-workbook.*"
      - "assets/safety-rules-edena.*"
      - "governance-kit/**"
      - "starter-kit/My-Nurse-AI-OS/**"
      - "assets/nurse-ai-os-media-packet*.md"
      - "assets/nurse-ai-os-media-packet*.pdf"
      - "assets/nurse-ai-os-architecture-report.md"
      - "assets/nurse-ai-os-architecture-report.pdf"
      - "assets/fonts/**"
      - "tools/build-governance-kit.py"
      - "tools/build-starter-kit.py"
      - "tools/build-pdfs.py"
      - "scripts/render-media-pdf.*"
      - "scripts/requirements-media-pdf.txt"
      - "package.json"
      - "package-lock.json"
      - "media.html"
      - "media-ar.html"
      - "media-hi.html"
      - "sitemap.xml"
      - "about.html"
      - "*/about.html"
      - "index.html"
      - "*/index.html"
      - "tests/test_media_packet.py"
      - "tests/test_public_governance_artifacts.py"
      - "tests/test_public_entrypoint_policy.py"
      - ".github/workflows/media-packet.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-media-pdf.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned media verifier
        run: |
          python -m pip install --require-hashes -r scripts/requirements-media-pdf.txt
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild and compare every media publication twice
        env:
          MEDIA_PDF_RENDERER: ${{ github.workspace }}/scripts/render-media-pdf.sh
        run: |
          targets=(architecture media media-es media-tl media-zh media-vi media-ru media-fr media-ar media-hi)
          artifacts=(
            assets/nurse-ai-os-architecture-report.pdf
            assets/nurse-ai-os-media-packet.pdf
            assets/nurse-ai-os-media-packet-es.pdf
            assets/nurse-ai-os-media-packet-tl.pdf
            assets/nurse-ai-os-media-packet-zh.pdf
            assets/nurse-ai-os-media-packet-vi.pdf
            assets/nurse-ai-os-media-packet-ru.pdf
            assets/nurse-ai-os-media-packet-fr.pdf
            media-ar.html
            media-hi.html
          )
          git ls-files --error-unmatch -- "${artifacts[@]}" >/dev/null
          python tools/build-pdfs.py "${targets[@]}"
          git diff --exit-code -- "${artifacts[@]}"
          python tools/build-pdfs.py "${targets[@]}"
          git diff --exit-code -- "${artifacts[@]}"
      - name: Rebuild and compare current Community governance resources twice
        env:
          MEDIA_PDF_RENDERER: ${{ github.workspace }}/scripts/render-media-pdf.sh
        run: |
          targets=(essentials founding make-yours power cheat roadmap workbook safety lamp)
          artifacts=(
            assets/hermes-essentials-guide.pdf
            assets/founding-year-guide.pdf
            assets/make-it-yours-six-workflows.pdf
            assets/hermes-power-guide.pdf
            assets/hermes-cheat-sheet.pdf
            assets/30-day-roadmap.pdf
            assets/nurse-ai-os-workbook.pdf
            assets/safety-rules-edena.pdf
            assets/lamp-huddle.pdf
            assets/governance-kit.zip
            assets/nurse-ai-os-starter-kit.zip
          )
          git ls-files --error-unmatch -- "${artifacts[@]}" >/dev/null
          python tools/build-governance-kit.py
          python tools/build-starter-kit.py
          python tools/build-pdfs.py "${targets[@]}"
          git diff --exit-code -- "${artifacts[@]}"
          python tools/build-governance-kit.py
          python tools/build-starter-kit.py
          python tools/build-pdfs.py "${targets[@]}"
          git diff --exit-code -- "${artifacts[@]}"
      - name: Verify source, publications, links, metadata, and policy
        run: |
          python tests/test_media_packet.py
          python tests/test_public_governance_artifacts.py
          python tests/test_public_entrypoint_policy.py
